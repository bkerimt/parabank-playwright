name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # Testler herkese açık (paylaşılan) ParaBank yerine, her çalışmada sıfırdan başlatılan
    # kendi ParaBank kopyamıza karşı çalışır: rate limit yok, başkalarının değiştirdiği ayar
    # ya da bozduğu veri yok.
    services:
      parabank:
        image: parasoft/parabank:latest
        ports:
          - 8080:8080

    env:
      BASE_URL: http://localhost:8080/parabank/
      PARABANK_ISOLATED: 'true'

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Wait for ParaBank to be ready
      run: |
        # 1) Veritabanina dokunan bir API cagrisi (ornek kullanici john/demo ile giris) basarili olana kadar bekle
        for i in $(seq 1 60); do
          if curl -sf -o /dev/null "${BASE_URL}services/bank/login/john/demo"; then
            echo "ParaBank API is up ($i)"
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "ParaBank API did not become ready within 5 minutes"
            exit 1
          fi
          echo "Waiting for ParaBank API... ($i)"
          sleep 5
        done

        # 2) Testlerin ilk adimi olan kayit islemi gercekten calisana kadar bir deneme kaydi yap
        for i in $(seq 1 30); do
          user="warmup$(date +%s%N | cut -c1-12)"
          if curl -s "${BASE_URL}register.htm" \
              --data-urlencode "customer.firstName=Warm" \
              --data-urlencode "customer.lastName=Up" \
              --data-urlencode "customer.address.street=Street 1" \
              --data-urlencode "customer.address.city=Istanbul" \
              --data-urlencode "customer.address.state=Istanbul" \
              --data-urlencode "customer.address.zipCode=34000" \
              --data-urlencode "customer.phoneNumber=5550000000" \
              --data-urlencode "customer.ssn=123-45-6789" \
              --data-urlencode "customer.username=${user}" \
              --data-urlencode "customer.password=Warm1234!" \
              --data-urlencode "repeatedPassword=Warm1234!" \
              | grep -q "Welcome ${user}"; then
            echo "Registration works ($i)"
            exit 0
          fi
          echo "Registration not ready yet ($i)"
          sleep 5
        done
        echo "Registration never succeeded"
        exit 1
    - name: Generate BDD tests
      run: npx bddgen
    - name: Run Playwright tests
      run: npx playwright test
    - name: Show ParaBank server logs
      if: ${{ failure() }}
      run: docker logs "$(docker ps -aq --filter ancestor=parasoft/parabank:latest | head -n 1)" 2>&1 | tail -n 300
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
