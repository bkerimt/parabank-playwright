name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # Testler herkese açık (paylaşılan) ParaBank yerine, her çalışmada sıfırdan başlatılan
    # kendi ParaBank kopyamıza karşı çalışır: rate limit yok, başkalarının değiştirdiği ayar
    # ya da bozduğu veri yok.
    services:
      parabank:
        image: parasoft/parabank:latest
        ports:
          - 8080:8080

    env:
      BASE_URL: http://localhost:8080/parabank/
      PARABANK_ISOLATED: 'true'

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Prepare ParaBank
      run: |
        # 1) Uygulama cevap verene kadar bekle
        for i in $(seq 1 60); do
          if curl -sf -o /dev/null "${BASE_URL}index.htm"; then
            echo "ParaBank is up ($i)"
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "ParaBank did not start within 5 minutes"
            exit 1
          fi
          echo "Waiting for ParaBank... ($i)"
          sleep 5
        done

        # 2) Docker imajinda veritabani bos basliyor (ornek musteriler, ayarlar ve numara sayaclari yok).
        #    ParaBank'in REST API'sindeki initializeDB servisiyle ornek verileri yukle; ornek kullanici
        #    john/demo ile API uzerinden giris calisana kadar tekrar dene. Her denemede HTTP kodlarini yazdir.
        for i in $(seq 1 12); do
          login_code=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}services/bank/login/john/demo")
          if [ "$login_code" = "200" ]; then
            echo "Database is initialized ($i)"
            break
          fi
          if [ "$i" -eq 12 ]; then
            echo "Database could not be initialized (last login HTTP code: $login_code)"
            exit 1
          fi
          init_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${BASE_URL}services/bank/initializeDB")
          echo "Initializing database... ($i) login HTTP $login_code, initializeDB HTTP $init_code"
          sleep 5
        done

        # 3) Testlerin ilk adimi olan kayit islemi gercekten calisiyor mu? Bir deneme kaydi yap.
        for i in $(seq 1 12); do
          user="warmup$(date +%s%N | cut -c1-12)"
          if curl -s "${BASE_URL}register.htm" \
              --data-urlencode "customer.firstName=Warm" \
              --data-urlencode "customer.lastName=Up" \
              --data-urlencode "customer.address.street=Street 1" \
              --data-urlencode "customer.address.city=Istanbul" \
              --data-urlencode "customer.address.state=Istanbul" \
              --data-urlencode "customer.address.zipCode=34000" \
              --data-urlencode "customer.phoneNumber=5550000000" \
              --data-urlencode "customer.ssn=123-45-6789" \
              --data-urlencode "customer.username=${user}" \
              --data-urlencode "customer.password=Warm1234!" \
              --data-urlencode "repeatedPassword=Warm1234!" \
              | grep -q "Welcome ${user}"; then
            echo "Registration works ($i)"
            exit 0
          fi
          echo "Registration not ready yet ($i)"
          sleep 5
        done
        echo "Registration never succeeded"
        exit 1
    - name: Generate BDD tests
      run: npx bddgen
    - name: Run Playwright tests
      run: npx playwright test
    - name: Show ParaBank server logs
      if: ${{ failure() }}
      run: docker logs "$(docker ps -aq --filter ancestor=parasoft/parabank:latest | head -n 1)" 2>&1 | tail -n 300
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
